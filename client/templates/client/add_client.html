{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add New Client</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
  <header>
    <h1>Add New Client</h1>
  </header>
  
  <main>
    <section>
      <h2>Client Registration</h2>
      <form action="" method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Client</button>
      </form>
    </section>
    <p><a href="{% url 'client_list' %}">Back to Client List</a></p>
  </main>
  
  <footer>
    <p>&copy; {{ current_year|default:"2023" }} Your Company Name</p>
  </footer>
</body>
</html>
